<body><main>
<header class="page-head"><div class="eyebrow">ORDER</div><h1>ご注文</h1><nav class="step-nav" aria-label="入力項目"><a href="#productShowcase"><b>1</b>商品</a><span>›</span><a href="#deliverySection"><b>2</b>お届け先</a><span>›</span><a href="#sender"><b>3</b>依頼主情報</a></nav></header>
<div id="adminPreview" class="admin-preview" hidden>設定の確認中です。</div>

<noscript>ご注文にはJavaScriptを有効にしてください。</noscript>
<form id="orderForm" class="order-layout"><div class="order-main">
<h2>1. ご注文の商品</h2><section class="showcase" id="productShowcase" aria-label="選択した商品"><img id="showcaseImage" class="showcase-main" src="assets/lafrance-orchard.jpg" alt="果樹園で実ったラ・フランス"><div class="showcase-info"><span class="product-badge">商品</span><h2 id="showcaseName">ラ・フランス 3kg 化粧箱</h2><div class="showcase-price"><span id="showcasePrice">￥3,600</span><small>税込／1箱</small></div><div class="box-detail" id="boxDetail"><img src="assets/lafrance-box.jpg" alt="ラ・フランスの化粧箱" loading="lazy"><span class="muted">ラ・フランス<br>3kg 化粧箱</span></div></div></section>
<h2 id="deliverySection" class="section-spacer">2. お届け先・商品</h2>

<div id="destinations"></div>
<button id="add" type="button">＋ 送付先を追加</button>
<section class="panel" id="sender"><h2>3. 依頼主情報</h2>
<div class="grid">
<label>郵便番号<input name="postal" autocomplete="section-sender postal-code" inputmode="numeric" placeholder="990-0000" pattern="[0-9０-９]{3}[-ー－]?[0-9０-９]{4}" required><span class="hint postal-status" aria-live="polite">7桁で住所を自動入力</span></label>
<label>氏名<input name="person" autocomplete="section-sender name" required maxlength="100"></label>
<label class="wide">住所<input name="address" autocomplete="section-sender street-address" placeholder="都道府県・市区町村・番地・建物名" required maxlength="250"></label>
<label>電話番号<input name="phone" type="tel" autocomplete="section-sender tel" required maxlength="30"></label>
</div></section></div><aside class="order-summary"><section class="panel summary-panel"><h2>ご注文内容</h2><div id="summaryItems" class="summary-items"></div><div class="summary-row"><span>商品代金（税込）</span><output id="summaryGoods">—</output></div><div class="summary-row"><span>送料（税込）</span><output id="summaryShipping">未確定</output></div>

<div class="totals" aria-live="polite"><span>合計（税込）<br><small id="count" class="muted"></small></span><output id="grandTotal" class="money grand">—</output></div>
<p class="billing">請求方法：商品は発送し、請求書は後日郵送いたします</p>
<div aria-hidden="true" style="position:absolute;left:-10000px"><input name="_gotcha" tabindex="-1" autocomplete="off"></div>
<div class="actions"><button type="submit" class="primary" id="submitOrder">注文する</button></div>
<p id="status" class="status" role="status"></p>
<p class="summary-subnote">山形県発送・通常便80サイズ<br>1箱につき1個口の送料（税込）</p></section></aside></form>

<dialog id="settingsDialog" aria-labelledby="settingsTitle"><div class="admin-heading"><h2 id="settingsTitle">商品設定</h2><button type="button" class="close-dialog" id="closeSettings" aria-label="設定を閉じる">閉じる</button></div>
<form id="adminLogin"><label>パスワード<input type="password" id="adminPassword" autocomplete="current-password" required></label><div class="actions"><button class="primary" type="submit">開く</button></div><p id="loginStatus" class="admin-status" role="status"></p></form>
<div id="adminContent" hidden><form id="catalogForm"><div id="adminProducts"></div><button type="button" id="addProduct">＋ 商品を追加</button><div class="actions"><button type="submit" class="primary" id="saveCatalog">変更を保存</button></div></form><p id="adminStatus" class="admin-status" role="status"></p>
<details class="admin-card"><summary>パスワードを変更</summary><form id="changePassword"><div class="password-grid"><label>新しいパスワード<input type="password" id="newPassword" autocomplete="new-password" minlength="6" required></label><label>もう一度入力<input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required></label></div><div class="actions"><button type="submit">変更する</button></div></form></details></div></dialog>

<template id="destinationTemplate"><section class="destination">
<div class="head"><h3 class="destination-title"></h3><button type="button" class="remove">削除</button></div>
<div class="grid product-fields"><label class="wide">商品名<select name="product"></select></label><div class="product-mini" aria-live="polite"><img alt="選択した商品" loading="lazy"><span></span></div>
<label>単価（税込）<input name="unit" readonly></label><label>注文個数<input name="quantity" type="number" min="1" max="999" step="1" value="1" required></label>
</div><fieldset class="receive-method"><legend>受取方法</legend><div class="receive-options"><label><input type="radio" name="method" value="delivery" required>配送</label><label><input type="radio" name="method" value="pickup" required>引き取り</label></div><div class="receive-note">受取方法を選択してください。</div></fieldset>
<div class="delivery-address" hidden><div class="grid">
<label>送付先郵便番号<input name="postal" inputmode="numeric" placeholder="990-0000" pattern="[0-9０-９]{3}[-ー－]?[0-9０-９]{4}"><span class="hint postal-status" aria-live="polite">7桁で住所を自動入力</span></label>
<label>送付先氏名<input name="person" maxlength="100"></label>
<label class="wide">送付先住所<input name="address" placeholder="都道府県・市区町村・番地・建物名" maxlength="250"></label>
<label>送付先電話番号<span class="optional">任意</span><input name="phone" type="tel" maxlength="30"></label>
</div></div>

<label class="wide date-field" hidden>希望発送日<span class="optional">任意</span><input name="date" type="date"><span class="hint">※収穫・美味しい時期に合わせて動的に発送するため、ご希望に添えない場合があります（お任せ）</span></label><div class="totals"><span>送料（税込）<br><small class="shipping-description muted"></small></span><output class="shipping money">—</output></div><div class="totals" aria-live="polite"><span>小計（税込）</span><output class="subtotal money">—</output></div></section></template>
<div class="mobile-bar"><div><div class="mobile-total-label">合計（税込）</div><div id="mobileTotal" class="mobile-total" aria-live="polite">未確定</div></div><button type="submit" form="orderForm" class="primary" id="mobileSubmit" disabled>注文する</button></div>
<script src="catalog.js"></script>
<script>
'use strict';
// 管理者用設定。商品はこの配列へ追加すると選択肢・単価に自動反映されます。
const CONFIG = {email:'spvv8fc9a@yahoo.co.jp',origin:'山形県',settingsApi:'https://order-settings.marukan1228sr.workers.dev',samePrefectureRate:1090,apiUrl:'https://formspree.io/f/mgaaajej'};
const DEFAULT_PRODUCTS=[{id:'lafrance3',name:'ラ・フランス 3kg 化粧箱',price:3600,image:'assets/lafrance-orchard.jpg',detailImage:'assets/lafrance-box.jpg',available:true}];
let PRODUCTS=DEFAULT_PRODUCTS.map(p=>({...p}));
let catalogReady=false;
let adminUnlocked=false,previewMode=false;
function validateProducts(items){
 if(!Array.isArray(items)||items.length<1||items.length>50)throw new Error('商品は1〜50件にしてください。');
 const ids=new Set();
 const result=items.map(p=>{
  if(!p||typeof p.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(p.id)||ids.has(p.id))throw new Error('商品IDが重複または不正です。');
  ids.add(p.id);
  if(typeof p.name!=='string'||!p.name.trim()||p.name.length>100||!Number.isSafeInteger(p.price)||p.price<1||p.price>1000000)throw new Error('商品名と単価（1〜1,000,000円）を確認してください。');
  const safeImage=src=>typeof src==='string'&&(/^(assets\/[a-zA-Z0-9._/-]+|https:\/\/[^\s]+|data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+)$/.test(src))?src:'';
  return {id:p.id,name:p.name.trim(),price:p.price,available:p.available!==false,image:safeImage(p.image),detailImage:safeImage(p.detailImage)};
 });
 if(!result.some(p=>p.available))throw new Error('販売中の商品を1件以上にしてください。');
 return result;
}
try{if(window.ORDER_CATALOG?.products)PRODUCTS=validateProducts(window.ORDER_CATALOG.products);}catch{console.warn('公開商品設定を読み込めないため初期値を使用します。');}

// 山形県（南東北）発・通常便80サイズ・税込・現金基本運賃。1箱1個口。
// 出典 https://www.kuronekoyamato.co.jp/ytc/search/estimate/ichiran.html（2026-10-27確認）
const REGIONS = [
 {name:'北海道',prefs:['北海道'],rate:1610},
 {name:'北東北',prefs:['青森県','岩手県','秋田県'],rate:1230},
 {name:'南東北',prefs:['宮城県','山形県','福島県'],rate:1230},
 {name:'関東',prefs:['茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','山梨県'],rate:1230},
 {name:'信越',prefs:['新潟県','長野県'],rate:1230},
 {name:'北陸',prefs:['富山県','石川県','福井県'],rate:1350},
 {name:'中部',prefs:['岐阜県','静岡県','愛知県','三重県'],rate:1350},
 {name:'関西',prefs:['滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県'],rate:1480},
 {name:'中国',prefs:['鳥取県','島根県','岡山県','広島県','山口県'],rate:1740},
 {name:'四国',prefs:['徳島県','香川県','愛媛県','高知県'],rate:1740},
 {name:'九州',prefs:['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県'],rate:2050},
 {name:'沖縄',prefs:['沖縄県'],rate:2380}
];
const $ = (s,root=document)=>root.querySelector(s);
const field=(root,name)=>root.querySelector(`[name="${name}"]`);
const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
const cards=()=>[...document.querySelectorAll('.destination')];
const normalize=s=>s.normalize('NFKC').trim();
const deliveryMode=card=>card.querySelector('input[type="radio"]:checked')?.value||'';
const postalValue=input=>normalize(input.value).replace(/[-ー－\s]/g,'');

function fillProductOptions(select){
 const previous=select.value;select.replaceChildren();
 PRODUCTS.forEach(p=>{const option=new Option(p.available?p.name:p.name+'（準備中）',p.id);option.disabled=!p.available;select.add(option);});
 const coming=new Option('その他の商品：ただいま準備中','coming-soon');coming.disabled=true;select.add(coming);
 select.value=PRODUCTS.some(p=>p.id===previous&&p.available)?previous:PRODUCTS.find(p=>p.available).id;
}
function refreshProductImage(card,product){
 const box=$('.product-mini',card),img=$('img',box);box.hidden=!product;
 if(!product)return;img.hidden=!product.image;if(product.image)img.src=product.image;img.alt=product.name;
 $('span',box).textContent=product.name+' ／ '+yen(product.price)+'（税込）';
}
function showProduct(product){
 const box=$('#productShowcase');box.hidden=!product;if(!product)return;
 $('#showcaseName').textContent=product.name;$('#showcasePrice').textContent=yen(product.price);
 const image=$('#showcaseImage');image.hidden=!product.image;if(product.image)image.src=product.image;image.alt=product.name;
 $('#boxDetail').hidden=!product.detailImage;
 if(product.detailImage){$('#boxDetail img').src=product.detailImage;$('#boxDetail img').alt=product.name+'の梱包';$('#boxDetail span').textContent=product.name;}
 box.style.gridTemplateColumns=product.image?'':'1fr';
}
function applyCatalog(items,preview){
 PRODUCTS=validateProducts(items);previewMode=preview;
 cards().forEach(card=>fillProductOptions(field(card,'product')));
 pendingRequest=null;update();showProduct(PRODUCTS.find(p=>p.id===field(cards()[0],'product').value));
 $('#adminPreview').hidden=!preview;
}

function calculation(card){
 const product=PRODUCTS.find(p=>p.id===field(card,'product').value&&p.available);
 const quantity=Number(field(card,'quantity').value);
 const validQuantity=Number.isInteger(quantity)&&quantity>=1&&quantity<=999;
 const pickup=deliveryMode(card)==='pickup';
 const address=normalize(field(card,'address').value);
 const region=REGIONS.find(r=>r.prefs.some(p=>address.startsWith(p)));
 const prefecture=region?.prefs.find(p=>address.startsWith(p));
 const rate=pickup?0:prefecture===CONFIG.origin?CONFIG.samePrefectureRate:region?.rate;
 const shipping=deliveryMode(card)&&product&&validQuantity&&rate!==undefined?rate*quantity:null;
 return {product,quantity,pickup,region,prefecture,rate,shipping,total:shipping===null?null:product.price*quantity+shipping};
}
function update(){
 let total=0,complete=true,boxes=0;
 cards().forEach((card,i)=>{
  $('.destination-title',card).textContent=`お届け先 ${i+1}`;
  $('.remove',card).hidden=cards().length===1;
  const c=calculation(card);
  field(card,'unit').value=c.product?yen(c.product.price):'—';
  refreshProductImage(card,c.product);
  const delivery=deliveryMode(card)==='delivery';
  $('.delivery-address',card).hidden=!delivery;
  $('.date-field',card).hidden=!delivery;field(card,'date').disabled=!delivery;
  for(const key of ['postal','address','person','phone']){field(card,key).disabled=!delivery;field(card,key).required=delivery&&key!=='phone';}
  $('.receive-note',card).textContent=delivery?'送付先をご入力ください。':c.pickup?'送料はかかりません。依頼主のお名前でお受け付けします。':'受取方法を選択してください。';
  $('.shipping',card).textContent=c.shipping===null?'未確定':yen(c.shipping);
  $('.shipping-description',card).textContent=!deliveryMode(card)?'受取方法を選択':c.pickup?'直接引き取り':c.rate===undefined?'都道府県を含む住所を入力':`${c.prefecture===CONFIG.origin?'山形県内':c.region.name} ／ ${yen(c.rate)} × ${c.quantity}個口`;
  $('.subtotal',card).textContent=c.total===null?'未確定':yen(c.total);
  if(c.total===null)complete=false;else total+=c.total;
  if(Number.isInteger(c.quantity)&&c.quantity>0)boxes+=c.quantity;
 });
 $('#grandTotal').textContent=complete?yen(total):'未確定';
 $('#count').textContent=`${cards().length}件・${boxes}箱`;
 $('#status').textContent='';
 refreshSummary();
}

function refreshSummary(){
 let goods=0,shipping=0,known=true,valid=true;const rows=[];
 cards().forEach(card=>{
  const c=calculation(card);if(!c.product||!Number.isInteger(c.quantity)||c.quantity<1||c.quantity>999){valid=false;known=false;return;}
  goods+=c.product.price*c.quantity;if(c.shipping===null)known=false;else shipping+=c.shipping;
  const row=document.createElement('div');row.className='summary-item';
  if(c.product.detailImage||c.product.image){const img=document.createElement('img');img.src=c.product.detailImage||c.product.image;img.alt=c.product.name;row.append(img);}
  const detail=document.createElement('div'),name=document.createElement('div'),qty=document.createElement('div');name.className='item-name';name.textContent=c.product.name;qty.className='item-qty';qty.textContent=yen(c.product.price)+' × '+c.quantity+'箱';detail.append(name,qty);row.append(detail);rows.push(row);
 });
 $('#summaryItems').replaceChildren(...rows);$('#summaryGoods').textContent=valid?yen(goods):'未確定';$('#summaryShipping').textContent=known?yen(shipping):'未確定';$('#mobileTotal').textContent=known&&valid?yen(goods+shipping):'未確定';
}

let callbackId=0;
function jsonpPostal(zip){
 return new Promise((resolve,reject)=>{
  const name=`zipcloudCallback${++callbackId}`;
  const script=document.createElement('script');
  const finish=()=>{clearTimeout(timer);script.remove();delete window[name];};
  const timer=setTimeout(()=>{finish();reject(new Error('住所検索がタイムアウトしました。手入力するか再入力してください。'));},10000);
  window[name]=data=>{finish();data.status===200?resolve(data.results):reject(new Error(data.message||'住所検索に失敗しました。'));};
  script.onerror=()=>{finish();reject(new Error('住所検索に接続できません。住所を手入力してください。'));};
  script.src=`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${encodeURIComponent(zip)}&callback=${name}`;
  document.head.append(script);
 });
}
function setupPostal(root){
 const input=field(root,'postal'),address=field(root,'address'),status=$('.postal-status',root);
 let generation=0,lastRequested='';
 async function lookup(){
  const zip=postalValue(input),current=++generation;
  if(!/^\d{7}$/.test(zip)){lastRequested='';status.textContent='7桁で住所を自動入力';return;}
  if(zip===lastRequested)return;
  lastRequested=zip;
  const previousAddress=address.value;
  status.textContent='住所を検索中…';
  try{
   const results=await jsonpPostal(zip);
   if(current!==generation||!root.isConnected||postalValue(input)!==zip||submitting||completed)return;
   if(!results?.length){lastRequested='';status.textContent='該当する住所がありません。住所を手入力してください。';return;}
   if(address.value!==previousAddress){status.textContent='入力中の住所を維持しました。郵便番号との一致をご確認ください。';return;}
   const candidates=[...new Set(results.map(r=>r.address1+r.address2+r.address3))];
   address.value=candidates.length===1?candidates[0]:results[0].address1+results[0].address2;
   status.textContent=candidates.length===1?'住所を入力しました。番地・建物名を追記してください。':'複数の町域があります。町名・番地・建物名を追記してください。';
   update();
  }catch(error){if(current===generation){lastRequested='';status.textContent=error.message;}}
 }
 input.addEventListener('input',lookup);
 input.addEventListener('blur',()=>{if(postalValue(input)!==lastRequested)lookup();});
}
let destinationId=0;
function addDestination(){
 const card=$('#destinationTemplate').content.firstElementChild.cloneNode(true);
 const id=++destinationId;
 card.querySelectorAll('input[type="radio"]').forEach(input=>input.name='method-'+id);
 card.querySelectorAll('input,select').forEach(input=>{input.autocomplete=`section-destination${id} ${ {postal:'postal-code',person:'name',address:'street-address',phone:'tel'}[input.name]||'off'}`;if(!['postal','person','address','phone'].includes(input.name))input.autocomplete='off';});
 fillProductOptions(field(card,'product'));
 field(card,'product').addEventListener('change',()=>{showProduct(PRODUCTS.find(p=>p.id===field(card,'product').value));});
 const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());field(card,'date').min=today.toISOString().slice(0,10);
 $('.remove',card).addEventListener('click',()=>{card.remove();pendingRequest=null;update();});
 $('#destinations').append(card);setupPostal(card);update();
 return card;
}

let submitting=false,completed=false,pendingRequest=null;
function orderData(){
 const value=(root,key)=>field(root,key).value.trim();
 const person=root=>Object.fromEntries(['postal','person','address','phone'].map(key=>[key,value(root,key)]));
 return {quotedTotal:cards().reduce((sum,card)=>sum+calculation(card).total,0),sender:person($('#sender')),destinations:cards().map(card=>({
  ...(deliveryMode(card)==='pickup'?{postal:'',person:field($('#sender'),'person').value.trim(),address:'',phone:''}:person(card)),pickup:deliveryMode(card)==='pickup',product:field(card,'product').value,
  quantity:Number(value(card,'quantity')),date:deliveryMode(card)==='pickup'?'':value(card,'date')
 }))};
}
function orderMessage(order){
 const sender=order.sender;
 const lines=['ご注文がありました。','照会番号：'+order.requestId,'','【依頼主】','郵便番号：'+sender.postal,'氏名：'+sender.person,'住所：'+sender.address,'電話番号：'+sender.phone];
 order.destinations.forEach((d,i)=>{
  const product=PRODUCTS.find(p=>p.id===d.product);
  const region=REGIONS.find(r=>r.prefs.some(p=>normalize(d.address).startsWith(p)));
  const rate=d.pickup?0:normalize(d.address).startsWith(CONFIG.origin)?CONFIG.samePrefectureRate:region.rate;
  const shipping=rate*d.quantity;
  lines.push('','【送付先 '+(i+1)+'】','受取方法：'+(d.pickup?'直接引き取り':'配送'),'郵便番号：'+(d.postal||'—'),'氏名：'+d.person,'住所：'+(d.address||'—'),'電話番号：'+(d.phone||'未記入'),'商品名：'+product.name,'単価（税込）：'+yen(product.price),'注文個数：'+d.quantity+'箱','希望発送日：'+(d.pickup?'対象外':d.date||'お任せ'),'送料（税込）：'+yen(shipping)+'（'+yen(rate)+' × '+d.quantity+'個口）','小計（税込）：'+yen(product.price*d.quantity+shipping));
 });
 lines.push('','総合計（税込）：'+yen(order.quotedTotal),'山形県発送／ヤマト運輸・通常便80サイズ／1箱1個口','※収穫・美味しい時期に合わせて動的に発送するため、ご希望に添えない場合があります（お任せ）','請求方法：商品は発送し、請求書は後日郵送いたします');
 return lines.join('\n');
}
$('#orderForm').addEventListener('input',()=>{if(!submitting&&!completed){pendingRequest=null;update();}});
$('#orderForm').addEventListener('change',()=>{if(!submitting&&!completed){pendingRequest=null;update();}});
$('#add').addEventListener('click',()=>{if(submitting||completed)return;pendingRequest=null;const card=addDestination();field(card,'postal').focus();});
$('#orderForm').addEventListener('submit',async event=>{
 event.preventDefault();if(submitting||completed||!catalogReady||!$('#orderForm').reportValidity())return;
 for(const card of cards())if(calculation(card).total===null){$('#status').textContent='送付先住所を都道府県から入力してください。';field(card,'address').focus();return;}
 if(!CONFIG.apiUrl){$('#status').textContent='現在、注文受付の準備中です。時間をおいて再度お試しください。';return;}
 const data=orderData();
 // 同じ画面内の再試行には同じ照会番号を付け、重複を照合できるようにします。
 if(!pendingRequest)pendingRequest={requestId:crypto.randomUUID(),...data};
 submitting=true;
 const controls=[...$('#orderForm').querySelectorAll('input,select,button'),$('#mobileSubmit')];
 const original=controls.map(control=>control.disabled);
 controls.forEach(control=>control.disabled=true);
 $('#submitOrder').textContent='送信中…';$('#mobileSubmit').textContent='送信中…';$('#status').textContent='';
 try{
  const payload={subject:'ご注文を受け付けました【'+pendingRequest.requestId+'】',message:orderMessage(pendingRequest),order_id:pendingRequest.requestId,_gotcha:field($('#orderForm'),'_gotcha').value};
  const response=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
  const result=await response.json();
  if(!response.ok||result.ok!==true){const failure=new Error(result.errors?.map(e=>e.message).join('／')||result.error||'注文を確認できませんでした。再度お試しください。');failure.confirmedFailure=true;throw failure;}
  completed=true;
  $('#status').textContent='ご注文を受け付けました。照会番号：'+pendingRequest.requestId;
  $('#submitOrder').textContent='受付完了';$('#mobileSubmit').textContent='受付完了';$('#status').scrollIntoView({behavior:'smooth',block:'center'});
 }catch(error){
  controls.forEach((control,i)=>control.disabled=original[i]);
  $('#submitOrder').textContent='注文する';$('#mobileSubmit').textContent='注文する';
  $('#status').textContent=error.confirmedFailure?error.message:'受付結果を確認できませんでした。注文が届いている可能性があります。重複を避けるため、照会番号 '+pendingRequest.requestId+' を控えてお問い合わせください。';
 }finally{submitting=false;}
});
setupPostal($('#sender'));addDestination();showProduct(PRODUCTS.find(p=>p.available));
$('#submitOrder').disabled=true;$('#mobileSubmit').disabled=true;
async function loadPublicCatalog(){
 try{const response=await fetch(CONFIG.settingsApi+'/catalog',{cache:'no-store'});if(!response.ok)throw new Error();const data=await response.json();window.ORDER_CATALOG=data;applyCatalog(data.products,false);catalogReady=true;$('#submitOrder').disabled=false;$('#mobileSubmit').disabled=false;}
 catch{$('#status').textContent='商品情報を読み込めませんでした。ページを再読み込みしてください。';}
}
loadPublicCatalog();
